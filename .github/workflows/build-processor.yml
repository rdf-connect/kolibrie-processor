name: Build and publish processor(s)

# Builds every processor crate in this repo (discovered via `cargo metadata`
# — any workspace member whose `[lib].crate-type` includes `cdylib` and that
# has a `processor.ttl` next to its Cargo.toml) as a `cdylib` for every
# target triple in the matrix below, computes each artifact's real SHA-256,
# and publishes everything to one GitHub Release:
#
#   <crate>.ttl              — a copy of that crate's processor.ttl, with its
#                               `owl:imports` target rewritten to <crate>-generated.ttl
#   <crate>-generated.ttl    — the merged, multi-target-triple :artifact table
#   <crate>-lib<crate>-<target-triple>.<ext>  — the built libraries themselves
#
# The crate-name prefix on every filename exists because GitHub Release
# assets are a flat namespace (no "/" allowed) — this is what keeps two
# processor crates in the same repo/release from colliding, without needing
# a separate release/tag per crate. See processor.ttl and
# rdfc-processor-buildtools' own docs for the full mechanism.
#
# The rdfc-rust-runner picks the right artifact at pipeline-startup time by
# matching its own compiled target triple against the `:artifact` table's
# `:targetTriple` entries (handed to it by the orchestrator, extracted from
# whatever `<crate>.ttl` a pipeline `owl:import`s), downloads it (caching by
# `:sha256`), and loads it via `abi_stable`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: so
            cross_linker: aarch64-linux-gnu-gcc
            cross_apt_package: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-13
            ext: dylib
          - target: aarch64-apple-darwin
            os: macos-14
            ext: dylib

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation linker
        if: matrix.cross_apt_package != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_apt_package }}
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER=${{ matrix.cross_linker }}" >> "$GITHUB_ENV"

      # NOTE: assumes this workflow still runs from within the
      # rdfc-rust-runner monorepo (kolibrie-processor/ as a subdirectory,
      # with ../processor-buildtools and ../processor-sdk available) — same
      # caveat as the path dependencies in Cargo.toml. Once this crate is
      # extracted to its own repository, replace this with
      # `cargo install rdfc-processor-buildtools` (once published) and drop
      # the `../` path deps in favor of a real version/git dependency.
      - name: Build rdfc-processor-buildtools (host target)
        run: cargo build --release --manifest-path ../processor-buildtools/Cargo.toml
      - name: Add buildtools to PATH
        run: echo "$GITHUB_WORKSPACE/../processor-buildtools/target/release" >> "$GITHUB_PATH"

      - name: Discover processor crates
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          crates=$(cargo metadata --format-version 1 --no-deps | jq -c '
            [ .packages[]
              | select(.targets[]? | .kind[]? == "cdylib")
              | { name, manifest_dir: (.manifest_path | rtrimstr("/Cargo.toml")) }
            ]
          ')
          echo "$crates" > crates.json
          echo "Discovered processor crates:"
          jq -r '.[] | "  " + .name + " (" + .manifest_dir + ")"' crates.json

      - name: Build, checksum, and snippet each discovered crate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts dist-snippets
          abi_token=$(rdfc-processor-buildtools abi-token)

          for row in $(jq -c '.[]' crates.json); do
            pkg=$(echo "$row" | jq -r '.name')
            dir=$(echo "$row" | jq -r '.manifest_dir')
            lib_stem=$(echo "$pkg" | tr '-' '_')

            cargo build --release --locked --target ${{ matrix.target }} -p "$pkg"

            src="target/${{ matrix.target }}/release/lib${lib_stem}.${{ matrix.ext }}"
            flat="lib${lib_stem}-${{ matrix.target }}.${{ matrix.ext }}"
            cp "$src" "dist-artifacts/$flat"
            sha256=$(rdfc-processor-buildtools checksum "dist-artifacts/$flat")

            while read -r class_uri; do
              [ -z "$class_uri" ] && continue
              rdfc-processor-buildtools snippet \
                --class "$class_uri" \
                --abi-token "$abi_token" \
                --target-triple ${{ matrix.target }} \
                --path "$flat" \
                --sha256 "$sha256" \
                --out "dist-snippets/${pkg}-${{ matrix.target }}.ttl"
            done < <(rdfc-processor-buildtools class-uris "$dir/processor.ttl")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: built-libs-${{ matrix.target }}
          path: dist-artifacts/*

      - uses: actions/upload-artifact@v4
        with:
          name: snippets-${{ matrix.target }}
          path: dist-snippets/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build rdfc-processor-buildtools
        run: cargo build --release --manifest-path ../processor-buildtools/Cargo.toml
      - run: echo "$GITHUB_WORKSPACE/../processor-buildtools/target/release" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          pattern: built-libs-*
          merge-multiple: true
          path: all-libs

      - uses: actions/download-artifact@v4
        with:
          pattern: snippets-*
          merge-multiple: true
          path: all-snippets

      - name: Discover processor crates
        id: discover
        run: |
          set -euo pipefail
          crates=$(cargo metadata --format-version 1 --no-deps | jq -c '
            [ .packages[]
              | select(.targets[]? | .kind[]? == "cdylib")
              | { name, manifest_dir: (.manifest_path | rtrimstr("/Cargo.toml")) }
            ]
          ')
          echo "$crates" > crates.json

      - name: Merge + flatten each crate's manifest, rename its libraries
        run: |
          set -euo pipefail
          mkdir -p dist

          for row in $(jq -c '.[]' crates.json); do
            pkg=$(echo "$row" | jq -r '.name')
            dir=$(echo "$row" | jq -r '.manifest_dir')

            # crate name for the flat, human-facing filenames — derived from
            # the processor.ttl's own directory name (e.g. "kolibrie" for
            # kolibrie-processor/), not the (more verbose) cargo package name.
            crate_name=$(basename "$dir" | sed 's/-processor$//')

            rdfc-processor-buildtools merge \
              "merged-${pkg}.ttl" \
              all-snippets/${pkg}-*.ttl

            rdfc-processor-buildtools flatten \
              --crate-name "$crate_name" \
              --processor-ttl "$dir/processor.ttl" \
              --generated-ttl "merged-${pkg}.ttl" \
              --out-dir dist

            for lib in all-libs/lib$(echo "$pkg" | tr '-' '_')-*; do
              cp "$lib" "dist/${crate_name}-$(basename "$lib")"
            done
          done

          ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
